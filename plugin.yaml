name: sieve
version: "0.1.0"
description: SIEVE — a user-owned notification boundary for Hermes Agent. Event classes x escalation tiers x quiet hours, with a Device-Access context brain and a mobile alarm escalation arm.
provides_tools:
  - sieve_ping
provides_hooks:
  - pre_gateway_dispatch
  - on_human_input_request
  - on_human_input_resolved
  - pre_approval_request
  - post_approval_response
  - kanban_task_blocked
  - subagent_stop
  - on_session_end
  - on_interim_message
